name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ucari-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Android platform
        run: |
          flutter create --platforms=android --org=com.ucari --project-name=ucari_yayinevi --no-pub .
          rm -f test/widget_test.dart
          python3 tool/configure_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ucari-yayinevi-release-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
