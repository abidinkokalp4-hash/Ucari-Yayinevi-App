name: ucari_yayinevi
description: UÇARI Yayınevi ve ZEYN STÜDYO.
version: 1.1.0+1
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/catalog.json
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.jpg
  min_sdk_android: 24
